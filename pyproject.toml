[project]
name = "langgraph-practice-note"
version = "0.1.0"
description = "LangGraph Practice Note Repo"
authors = [
    {name = "Eumgill98",email = "wjdghcks02@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = "<4.0.0,>=3.11"
dependencies = [
    "langchain (>=1.1.0,<2.0.0)",
    "langgraph (>=1.0.3,<2.0.0)",
    "langchain-core (>=1.1.0,<2.0.0)",
    "langchain-community (>=0.4.1,<0.5.0)",
    "openai (>=2.8.1,<3.0.0)",
    "langchain-openai (>=1.1.0,<2.0.0)",
    "langchain-anthropic (>=1.2.0,<2.0.0)",
    "langchain-upstage (>=0.7.5,<0.8.0)",
    "langchain-google-genai (>=3.2.0,<4.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "langchain-tavily (>=0.2.13,<0.3.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
